/* Cover: quiet Manrope typography and the website's transparent portrait. */
.hero{grid-template-columns:minmax(0,1fr) 320px;gap:56px;padding:62px 0 54px;min-height:440px}
.hero h1{font-family:'Manrope',var(--sans);font-size:clamp(44px,5.1vw,68px);font-weight:400;line-height:1.13;letter-spacing:-.055em}
.hero h1 .surname{font-family:inherit;font-size:1em;font-style:normal;font-weight:500;line-height:inherit;letter-spacing:inherit;margin-top:2px}
.portrait{width:300px;max-width:100%;margin:0;justify-self:end;background:transparent;border:0;border-radius:0;box-shadow:none}
.portrait:before{content:none}
.portrait img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;border:0;border-radius:0;margin:0;background:transparent;filter:grayscale(1);mask-image:linear-gradient(to bottom,#000 0%,#000 79%,transparent 100%);animation:portrait-float 7s ease-in-out infinite}
.hero-art{opacity:.16;right:1%;width:54%;mask-image:linear-gradient(90deg,transparent,#000 45%)}
@keyframes portrait-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Reading sizes: give the CV's substantive text more presence and contrast. */
@media screen{
 :root{--copy:#c7c8c2}
 body{font-size:16px}
 .profile-copy{font-size:18px;line-height:1.8;max-width:72ch;color:var(--copy)}
 .bullet-list{max-width:78ch}
 .bullet-list li{font-size:17px;line-height:1.8;color:var(--copy)}
 .bullet-list li+li{margin-top:16px}
 .bullet-list li:before{top:.9em}
 .education-entry .description{font-size:17px;line-height:1.8;color:var(--copy)}
 .subsection .bullet-list li{font-size:16px;line-height:1.8}
 .languages li{font-size:16px;color:var(--copy)}
 .contact-group a{font-size:17px}
 .contact-group p{font-size:16px;color:var(--copy)}
 .entry-date,.assignment-date{font-size:12px}
 .entry-company{font-size:12px;line-height:1.7;letter-spacing:.045em}
 .assignment h4{font-size:21px}
 .assignments-label,.section-heading{font-size:12px}
 .skills-title{font-size:14px}
 .skill-list{gap:9px}
 .skill-list li{font-size:12px;line-height:1.6;padding:6px 12px;color:#bfc0bb}
}
@media screen and (max-width:700px){
 .profile-copy,.bullet-list li,.subsection .bullet-list li,.education-entry .description{font-size:16px;line-height:1.8}
 .bullet-list li+li{margin-top:15px}
 .entry-company{font-size:11px}
 .entry-date,.assignment-date{font-size:12px}
 .assignment h4{font-size:20px}
 .assignments-label,.section-heading{font-size:11px}
 .skill-list{gap:8px}
 .skill-list li{font-size:11.5px;padding:5px 10px}
 .contact-group a,.contact-group p,.languages li{font-size:16px}
}
/* Language gauges retain the CV's written proficiency levels. */
.languages{grid-template-columns:1fr;gap:23px;margin-top:25px}
.languages li{padding:0;border:0;min-width:0}
.language-label{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:11px}
.language-label>span:first-child{color:var(--ink)}
.language-level{color:var(--muted);font-size:13px}
.language-gauge{height:4px;width:100%;overflow:hidden;background:#30302f;border-radius:4px}
.language-fill{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8f9189,var(--ink));transform:scaleX(var(--mastery));transform-origin:left}
html[data-motion='on'] .language-fill{transition:transform 1.5s cubic-bezier(.2,.7,.25,1) var(--gauge-delay,0ms)}
html[data-motion='on'] .gauge-pending .language-fill{transform:scaleX(0)}
@media print{.language-gauge{background:#ddd;print-color-adjust:exact;-webkit-print-color-adjust:exact}.language-fill{background:#555;transform:scaleX(var(--mastery))!important}.language-label>span:first-child{color:#111}.language-level{color:#444}}
/* Countries: flags only, with accessible names and native hover labels. */
.country-flags{display:flex;align-items:center;flex-wrap:wrap;gap:17px;width:fit-content;max-width:100%;margin-top:27px;padding-top:23px;border-top:1px solid var(--line)}
.country-flag{display:inline-flex;flex:none;line-height:0}
.country-flag svg{display:block;width:auto;height:24px;box-shadow:0 0 0 1px #ffffff14;border-radius:1px}
